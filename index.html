<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas com jQuery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <h1>Minha Lista de Tarefas</h1>
        <button type="button">Nova Tarefa +</button>
    </header>
    
    <form>
        <h2>Adicionar nova tarefa</h2>
        <!-- Alterado o tipo para text e o id/placeholder para o contexto de tarefas -->
        <input type="text" id="nome-tarefa" required placeholder="Nome da tarefa" />
        <button type="submit">Cadastrar</button>
        <button type="button" id="botao-cancelar">Cancelar</button>
    </form>

    <ul>
        <!-- Os itens de tarefa serão adicionados aqui via jQuery -->
    </ul>

    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script src="main.js"></script>
</body>
</html>

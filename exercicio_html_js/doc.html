<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Validação Numérica</title>
    <style>
        .message { padding: 10px; margin-top: 10px; border-radius: 5px; display: none; }
        .success { background-color: #d4edda; color: #155724; display: block; }
        .error { background-color: #f8d7da; color: #721c24; display: block; }
        form { display: flex; flex-direction: column; width: 250px; gap: 10px; }

        body {
            height: 100vh;
            margin: 0;
            display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        }
    </style>
</head>
<body>

    <form id="meuFormulario">
        <label for="campoA">Número A:</label>
        <input type="number" id="campoA" required>

        <label for="campoB">Número B:</label>
        <input type="number" id="campoB" required>

        <button type="submit" id="btnValidar">Validar</button>
    </form>

    <div id="mensagemFeedback" class="message"></div>

    <script src="script.js"></script>
</body>
</html>
